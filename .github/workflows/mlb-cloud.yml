name: MLB Forecast Lab — hourly baseball forecasts

on:
  schedule:
schedule:
  - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/**'
      - '.github/workflows/mlb-cloud.yml'

concurrency:
  group: mlb-forecast-cloud
  cancel-in-progress: false

jobs:
  forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Install Python model dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Refresh official data and lock pregame predictions
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m cloud.worker run
      - name: Preserve data, locked predictions and calibration
        run: |
          git config user.name 'mlb-forecast-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- MLB_Forecast_Lab_Cloud_Automation_COMPLETE/
          if ! git diff --cached --quiet; then
            git commit -m 'MLB forecast: refresh official data and pregame records'
            git push
          fi
      - name: Upload forecast website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site

  deploy:
    needs: forecasts
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy site to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
