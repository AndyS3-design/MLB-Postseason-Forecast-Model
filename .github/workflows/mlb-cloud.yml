name: MLB Forecast Lab — game-time forecasts

on:
  # 2026 season archived: recurring schedule paused; use workflow_dispatch to run manually.
  workflow_dispatch:
    inputs:
      recovery:
        description: 'Official pregame recovery: bounded hold until final window'
        type: boolean
        required: false
        default: false
  push:
    branches: [master]
    paths:
      - '.github/workflows/mlb-cloud.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/model_version.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v18_*.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_batting.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/matchup_model.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_matchup_core.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v27_original_persistence.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v27_original_persistence.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/preflight.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/pregame_wait.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_pregame_wait.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v19_forecast_guard.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v19_forecast_guard.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v11_daily.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/two_stage.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v12_two_stage.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v13_postseason_context.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v13_postseason_context.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v13_score_presentation.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v13_preliminary_update.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v14_totals.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v15_lineup_refresh.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/official_hitter_history.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v16_official_hitter_history.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v17_prospective.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/public_site_health.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_public_site_health.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v17_quality.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v17_scoring_research.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_sources.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud_records/lineup_refresh_requests/**'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v6_baseball_totals.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v14_site.cjs'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v20_winner_site.cjs'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v20_winner_score.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v22_accuracy_gate.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v22_accuracy_gate.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v22_joint_markets.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v23_elo_ensemble.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v23_elo_ensemble.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v17_prospective.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud_records/preliminary_update_requests/**'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/data/official_postseason_2020_2025.csv'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_simulation.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v6_display.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_revision.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_forecast_finish_time.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_workflow.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v8_challengers.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v21_kalshi_shadow.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v8_challengers.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v9_run_health.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v9_tracking.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v9_tracking.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v9_run_health.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v10_schedule_audit.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v10_schedule_audit.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/preflight.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud_records/revision_requests/**'

concurrency:
  group: mlb-forecast-cloud
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_model: ${{ steps.gate.outputs.run_model }}
      mode: ${{ steps.gate.outputs.mode }}
      preliminary_game_ids: ${{ steps.gate.outputs.preliminary_game_ids }}
      game_ids: ${{ steps.gate.outputs.game_ids }}
    steps:
      - uses: actions/checkout@v5
      - name: Check official MLB schedule
        id: gate
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.recovery }}" = "true" ]; then
            python cloud/preflight.py --recovery --github-output "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            python cloud/preflight.py --manual --github-output "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 11 * * *" ]; then
            python cloud/preflight.py --maintenance --github-output "$GITHUB_OUTPUT"
          else
            python cloud/preflight.py --github-output "$GITHUB_OUTPUT"
          fi

  forecasts:
    needs: check
    if: needs.check.outputs.run_model == 'true'
    runs-on: ubuntu-latest
    # The job may enter up to four hours ahead of first pitch; it sleeps
    # before running the unchanged timing-verified forecasting worker.
    timeout-minutes: 285
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt
      - name: Install Python model dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt
      - name: Restore and save frozen historical scoring-model cache
        uses: actions/cache@v4
        with:
          path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/outputs/v8_cache
          key: mlb-v8-frozen-${{ runner.os }}-python312-${{ hashFiles('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_matchup_core.py', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/model_version.py', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/matchup_model.py', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_batting.py', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v8_model_cache.py', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/data/GL2023.TXT', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/data/GL2024.TXT', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/data/GL2025.TXT', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/data/gl20*.zip', 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/data/advanced_pitching_details.csv') }}
      - name: Verify cloud forecasting safeguards
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_cloud cloud.test_v7 cloud.test_starter_backfill cloud.test_revision cloud.test_forecast_finish_time cloud.test_v8_challengers cloud.test_v9_tracking cloud.test_v9_run_health cloud.test_v10_schedule_audit cloud.test_v11_daily cloud.test_v12_two_stage cloud.test_v13_postseason_context cloud.test_v13_score_presentation cloud.test_v13_preliminary_update cloud.test_v14_totals cloud.test_v15_lineup_refresh cloud.test_v16_official_hitter_history cloud.test_v17_quality cloud.test_v17_scoring_research cloud.test_public_site_health cloud.test_v18_scheduling cloud.test_v18_batting cloud.test_v18_simulation cloud.test_v18_accuracy cloud.test_v19_forecast_guard cloud.test_v20_winner_score cloud.test_v21_kalshi_shadow cloud.test_v22_joint_markets cloud.test_v22_accuracy_gate cloud.test_v23_elo_ensemble cloud.test_v27_original_persistence cloud.test_pregame_wait -q
      - name: Wait for the official original-pregame window when cron arrives early
        if: needs.check.outputs.mode == 'pregame' && needs.check.outputs.game_ids != ''
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        env:
          EXPECTED_GAME_IDS: ${{ needs.check.outputs.game_ids }}
        run: python -m cloud.pregame_wait --game-ids "$EXPECTED_GAME_IDS"
      - name: Refresh verified MLB data and forecast before first pitch
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          if [ "${{ needs.check.outputs.mode }}" = "pregame" ]; then
            python -m cloud.worker run --fast
          else
            python -m cloud.worker run
          fi
      - name: Persist immutable originals and append-only official settlements
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          root=MLB_Forecast_Lab_Cloud_Automation_COMPLETE
          PYTHONPATH="$root" python3 -m cloud.v27_original_persistence --repo "$GH_REPO" --root . --report-file "$RUNNER_TEMP/v29_persistence.json"
          # When a concurrent runner already saved a different valid original,
          # never publish this run's losing simulation to the public website.
          if python3 -c 'import json,sys;sys.exit(0 if json.load(open(sys.argv[1]))["first_writer_accepted"] else 1)' "$RUNNER_TEMP/v29_persistence.json"; then
            echo "SKIP_SECONDARY_ON_FIRST_WRITER=1" >> "$GITHUB_ENV"
            git restore --worktree -- "$root/site"
            git clean -fd -- "$root/site"
            echo "::warning::First writer is authoritative; publish only previously committed site, not losing simulation."
          fi
          # Only after EVERY original is durably verified: drop local copies
          # that differ from remote to avoid conflict during secondary git pull.
          git restore --worktree -- "$root/cloud_records/predictions/"
          git clean -f -- "$root/cloud_records/predictions/"

      - name: Publish secondary status and website data (noncritical)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SKIP_SECONDARY_ON_FIRST_WRITER:-}" = "1" ]; then
            echo "::notice::Secondary status/site commit skipped to protect authoritative first forecast."
            exit 0
          fi
          git config user.name 'mlb-forecast-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          root=MLB_Forecast_Lab_Cloud_Automation_COMPLETE
          git add -A -- "$root/"
          git reset -q -- "$root/cloud_records/predictions/" || true
          if git diff --cached --name-only | grep -E '^MLB_Forecast_Lab_Cloud_Automation_COMPLETE/outputs/v8_cache/'; then
            echo 'Refusing to commit serialized model cache artifacts.' >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'MLB forecast: refresh secondary status and website'
            if ! (git pull --rebase origin master && git push origin HEAD:master); then
              git rebase --abort || true
              echo "::warning::Secondary data sync conflicted; immutable original forecast is already saved."
            fi
          fi
      - name: Upload baseball forecast website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site

  deploy:
    needs: forecasts
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy forecast website
        id: deploy
        uses: actions/deploy-pages@v4


  public_site_health:
    name: Verify public deployed page and forecasts are reachable
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Confirm real public HTTP availability after Pages propagation
        env:
          DEPLOYED_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          python3 -m cloud.public_site_health --url "$DEPLOYED_PAGES_URL" --attempts 15 --delay-seconds 20

  forecast_health:
    needs: [check, forecasts]
    if: always() && needs.check.outputs.run_model == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout final persisted repository state
        uses: actions/checkout@v5
        with:
          ref: master
      - name: Require original forecasts for each game caught by the schedule gate
        env:
          EXPECTED_GAME_IDS: ${{ needs.check.outputs.game_ids }}
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          python -m cloud.v9_run_health

