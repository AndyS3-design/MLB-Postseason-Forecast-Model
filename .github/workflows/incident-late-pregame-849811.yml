name: One-time independent live MLB warmups check / research forecast
on:
  push:
    branches: ['incident/verify-late-warmups-20261014']
    paths:
      - '.github/workflows/incident-late-pregame-849811.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  late-pregame-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - name: Probe official MLB actual first pitch / live play feed immediately
        run: |
          python3 - <<'PY'
          import json,urllib.request,datetime
          url='https://statsapi.mlb.com/api/v1.1/game/849811/feed/live'
          req=urllib.request.Request(url,headers={'User-Agent':'MLB Forecast Lab actual-game-state preflight'})
          with urllib.request.urlopen(req,timeout=15) as response: data=json.load(response)
          status=data['gameData']['status']
          plays=(data.get('liveData',{}).get('plays') or {}).get('allPlays') or []
          print('FAST_LIVE_STATUS',datetime.datetime.now(datetime.timezone.utc).isoformat(),
                json.dumps(status),'recorded_at_bats',len(plays),flush=True)
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt
      - name: Install exact model dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt
      - name: Attempt one original-time-stamped late pregame V18 research comparison
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m cloud.incident_late_pregame
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: researched-actual-pregame-model-output
          path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/outputs/incident_late_pregame_849811.json
          if-no-files-found: ignore
