name: V8 Research — Historical Recency Comparison
on:
  push:
    branches: ['research/v8-recency-test']
    paths:
      - '.github/workflows/mlb-v8-recency.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v8_recency_review.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v8_recency_review.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v8-recency-review
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Check preset research comparison
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_v8_recency_review cloud.test_v8_walkforward -q
      - name: Evaluate 2024-selected recency against 2025
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m cloud.v8_recency_review
      - uses: actions/upload-artifact@v4
        with:
          name: recency-history-review
          path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/outputs/v8_validation/recency_half_life_review.json
      - name: Store research report
        run: |
          git config user.name 'mlb-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MLB_Forecast_Lab_Cloud_Automation_COMPLETE/outputs/v8_validation/recency_half_life_review.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: report preselected recency half-life comparison'
            git pull --rebase origin research/v8-recency-test
            git push origin HEAD:research/v8-recency-test
          fi
