name: V17 CI — Forecast reliability, accuracy and audited inputs
on:
  push:
    branches: ['feature/v17-reliability-evaluation']
    paths:
      - '.github/workflows/mlb-v17-upgrade.yml'
      - '.github/workflows/mlb-cloud.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/preflight.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v17_prospective.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v17_scoring_research.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v17_quality.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v17_scoring_research.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_sources.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_workflow.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_matchup_core.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v8_challengers.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
  pull_request:
    paths:
      - '.github/workflows/mlb-v17-upgrade.yml'
      - '.github/workflows/mlb-cloud.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/preflight.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v17_prospective.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v17_scoring_research.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v17_quality.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v17_scoring_research.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_sources.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_workflow.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/v4_matchup_core.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v8_challengers.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Install existing forecast dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Record exact tested runner dependencies and verify installation consistency
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          mkdir -p outputs/v17_research
          python -m pip freeze > outputs/v17_research/ci_python312_dependencies.txt
          python -m pip check
      - name: Full original forecast and V17 regression suite
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_v17_quality cloud.test_v17_scoring_research cloud.test_v16_official_hitter_history cloud.test_v15_lineup_refresh cloud.test_v14_totals cloud.test_v13_score_presentation cloud.test_v13_preliminary_update cloud.test_v13_postseason_context cloud.test_v12_two_stage cloud.test_v11_daily cloud.test_v10_schedule_audit cloud.test_v9_tracking cloud.test_v9_run_health cloud.test_v8_challengers cloud.test_forecast_finish_time cloud.test_cloud cloud.test_v7 cloud.test_starter_backfill cloud.test_revision -q
      - name: Compute independent season-separated score-distribution evidence
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m cloud.v17_scoring_research
      - name: Validate dashboard JavaScript and historical distribution
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          node cloud/test_v14_site.cjs
          python - <<'PY'
          from pathlib import Path
          html=Path('site/index.html').read_text()
          assert 'Prospective distribution calibration' in html
          assert 'renderDistributionValidation' in html
          Path('/tmp/mlb_v17_dashboard.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/mlb_v17_dashboard.js
      - uses: actions/upload-artifact@v4
        with:
          name: historical-run-distribution-v17
          path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/outputs/v17_research/
          if-no-files-found: error
