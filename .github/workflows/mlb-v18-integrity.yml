name: V18 CI — Forecast integrity regressions

on:
  push:
    branches: ['codex/fix-forecast-integrity']
  pull_request:
    paths:
      - '.github/workflows/mlb-cloud.yml'
      - '.github/workflows/mlb-v18-integrity.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/**/*.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt
      - name: Install tested forecast dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt
      - name: Run all cloud regression tests
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest discover -s cloud -p 'test_*.py' -q
      - name: Check dashboard JavaScript
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: node cloud/test_v14_site.cjs
