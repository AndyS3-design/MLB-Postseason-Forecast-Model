name: V10 CI — Independent Official Schedule Audit
on:
  push:
    branches: ['hardening/v10-official-schedule-audit']
    paths:
      - '.github/workflows/mlb-v10-schedule-audit.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v10_schedule_audit.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v10_schedule_audit.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
      - '.github/workflows/mlb-cloud.yml'
  pull_request:
    paths:
      - '.github/workflows/mlb-v10-schedule-audit.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v10_schedule_audit.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v10_schedule_audit.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
      - '.github/workflows/mlb-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Verify all V9 + V10 safeguards
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_v10_schedule_audit cloud.test_v9_tracking cloud.test_v9_run_health cloud.test_v8_challengers cloud.test_forecast_finish_time cloud.test_cloud cloud.test_v7 cloud.test_starter_backfill cloud.test_revision -q
      - name: Check worker and independent audit Python syntax
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m py_compile cloud/worker.py cloud/v10_schedule_audit.py
      - name: Validate browser code and report references
        run: |
          python - <<'PY'
          from pathlib import Path
          worker=Path('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py').read_text()
          site=Path('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html').read_text()
          assert "'official_schedule_audit':official_audit" in worker
          assert "renderOfficialScheduleAudit(d.official_schedule_audit)" in site
          Path('/tmp/mlb_v10.js').write_text(site.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/mlb_v10.js
