name: V8 Hardening — Cache & Site
on:
  push:
    branches: ['hardening/v8-cache-integrity']
    paths:
      - '.github/workflows/mlb-v8-hardening.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v8_model_cache.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v8_cache.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Cache and full forecasting safeguards
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_v8_cache cloud.test_v8_evaluate cloud.test_v8_bullpen cloud.test_cloud cloud.test_v7 cloud.test_starter_backfill cloud.test_revision -q
      - name: Site JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html').read_text()
          Path('/tmp/mlb.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/mlb.js
