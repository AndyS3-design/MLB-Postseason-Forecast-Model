name: V15 — Official Lineup Feed Audit
on:
  push:
    branches: ['feature/v15-official-lineup-refresh']
    paths:
      - '.github/workflows/mlb-v15-lineup-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official MLB pregame feed availability
        run: |
          python - <<'PY'
          import json,urllib.request
          url='https://statsapi.mlb.com/api/v1.1/game/849811/feed/live'
          req=urllib.request.Request(url,headers={'User-Agent':'MLB Forecast Lab lineup audit/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r: game=json.load(r)
          data=game.get('gameData',{})
          print('Status',data.get('status'))
          print('Venue',data.get('venue',{}).get('name'))
          players=data.get('players') or {}
          teams=game.get('liveData',{}).get('boxscore',{}).get('teams',{})
          print('GameData player identities:',len(players))
          for side in ('away','home'):
            t=teams.get(side,{})
            order=t.get('battingOrder') or []
            bs=t.get('players') or {}
            ordered=[(pid,v.get('battingOrder')) for pid,v in bs.items() if v.get('battingOrder')]
            print(side,'listed battingOrder',order,'player entries',len(bs),'player-order annotations',ordered)
            for pid in order:
              p=bs.get('ID'+str(pid),{})
              person=p.get('person') or players.get('ID'+str(pid)) or {}
              print('  ',pid,person.get('fullName'),person.get('id'), 'batting-side',person.get('batSide'))
          PY
