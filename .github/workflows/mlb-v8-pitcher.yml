name: V8 Research — Starter Weight Evaluation
on:
  push:
    branches: ['research/v8-pitcher-calibration']
    paths:
      - '.github/workflows/mlb-v8-pitcher.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v8_pitcher_review.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v8-pitcher-weight-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Verify review candidates
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_v8_pitcher_review -q
      - name: Test original pitcher weight against 2022–2025 chronological folds
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m cloud.v8_pitcher_review
      - uses: actions/upload-artifact@v4
        with:
          name: v8-pitcher-weight-review
          path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/outputs/v8_validation/pitcher_weight_review.json
      - name: Save research report to branch
        run: |
          git config user.name 'mlb-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MLB_Forecast_Lab_Cloud_Automation_COMPLETE/outputs/v8_validation/pitcher_weight_review.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: V8 starter-weight ablation across chronological years'
            git pull --rebase origin research/v8-pitcher-calibration
            git push origin HEAD:research/v8-pitcher-calibration
          fi
