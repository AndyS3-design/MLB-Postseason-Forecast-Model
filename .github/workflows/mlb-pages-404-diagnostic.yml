name: Diagnose public MLB Forecast Lab Pages 404
on:
  push:
    branches: ['fix/pages-404-public-health']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  public-pages-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check GitHub Pages API, current and previous public addresses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,time
          api='https://api.github.com/repos/AndyS3-design/MLB-Postseason-Forecast-Model/pages'
          urls=[
            'https://andys3-design.github.io/MLB-Postseason-Forecast-Model/',
            'https://andys3-design.github.io/MLB_Backtest_Expanded_2026_Postseason_Markets/',
            'https://andys3-design.github.io/'
          ]
          print('PAGES_API_DIAG:')
          req=urllib.request.Request(api,headers={
              'User-Agent':'MLB-Forecast-Lab-Pages-404-diagnostic',
              'Accept':'application/vnd.github+json',
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version':'2022-11-28'})
          try:
            with urllib.request.urlopen(req,timeout=30) as response:
              data=json.load(response)
            print(json.dumps({k:data.get(k) for k in (
                'status','html_url','build_type','source','cname','public','https_enforced',
                'pending_domain_unverified_at')},indent=2))
          except urllib.error.HTTPError as e:
            print('PAGES_API_ERROR',e.code,e.read(700).decode(errors='replace'))
          for url in urls:
            request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 MLBForecastLab-404-check','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(request,timeout=30) as response:
                body=response.read(500)
                print('PUBLIC_CHECK',url,'status',response.status,'final',response.url,
                   'content_type',response.headers.get('Content-Type'),
                   'body_preview',repr(body[:160]))
            except urllib.error.HTTPError as e:
              print('PUBLIC_CHECK',url,'HTTP_ERROR',e.code,'final',e.url,
                   'body_preview',repr(e.read(200)))
            except Exception as e:
              print('PUBLIC_CHECK',url,'NETWORK_ERROR',type(e).__name__,str(e)[:200])
          PY
