name: V15 CI — Official lineup refresh
on:
  push:
    branches: ['feature/v15-official-lineup-refresh']
    paths:
      - '.github/workflows/mlb-v15-confirmed-lineups.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v15_lineup_refresh.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
  pull_request:
    paths:
      - '.github/workflows/mlb-v15-confirmed-lineups.yml'
      - '.github/workflows/mlb-cloud.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v15_lineup_refresh.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineup-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Install forecasting dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Test official lineup and original forecast integrity
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_v15_lineup_refresh cloud.test_v14_totals cloud.test_v13_score_presentation cloud.test_v13_preliminary_update cloud.test_v13_postseason_context cloud.test_v12_two_stage cloud.test_v11_daily cloud.test_v10_schedule_audit cloud.test_v9_tracking cloud.test_v9_run_health cloud.test_v8_challengers cloud.test_forecast_finish_time cloud.test_cloud cloud.test_v7 cloud.test_starter_backfill cloud.test_revision -q
      - name: Verify updated website JavaScript compiles and lineups label appears
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html').read_text()
          assert 'lineup_confirmed_pregame' in html
          assert 'Confirmed batting orders in this simulation' in html
          Path('/tmp/mlb_v15.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/mlb_v15.js
          cd MLB_Forecast_Lab_Cloud_Automation_COMPLETE
          node cloud/test_v14_site.cjs
