name: V13 CI — Immutable Updated Preliminary
on:
  push:
    branches: ['feature/v13-updated-preliminary-20261014']
  pull_request:
    paths:
      - '.github/workflows/mlb-v13-preview-update.yml'
      - '.github/workflows/mlb-cloud.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v13_preliminary_update.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Run complete preview/final & scoring integrity checks
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          python -m unittest cloud.test_v13_preliminary_update cloud.test_v13_postseason_context cloud.test_v13_score_presentation cloud.test_v12_two_stage cloud.test_v11_daily cloud.test_v10_schedule_audit cloud.test_v9_tracking cloud.test_v9_run_health cloud.test_v8_challengers cloud.test_forecast_finish_time cloud.test_cloud cloud.test_v7 cloud.test_starter_backfill cloud.test_revision -q
      - name: Validate dashboard script and versioned forecasts
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html').read_text()
          assert 'preliminary_updated_pregame' in html
          Path('/tmp/mlb_updated_preview.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/mlb_updated_preview.js
