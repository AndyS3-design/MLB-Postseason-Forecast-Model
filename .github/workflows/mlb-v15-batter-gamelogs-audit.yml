name: V15 diagnostic — official historical batter game logs
on:
  push:
    branches: ['audit/v15-lineup-effect']
    paths:
      - '.github/workflows/mlb-v15-batter-gamelogs-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examine-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official pregame hitting game-log API (no changes)
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse
          root='https://statsapi.mlb.com/api/v1/people/605141/stats?'
          for extra in ({'stats':'gameLog','group':'hitting','season':'2026','sportIds':'1'},
                        {'stats':'gameLog','group':'hitting','season':'2026','sportIds':'1','gameType':'R,F,D,L,W'},
                        {'stats':'gameLog','group':'hitting','season':'2026','sportIds':'1','gameType':'R'}):
              url=root+urllib.parse.urlencode(extra)
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MLB Forecast Lab historical batter audit/1.0'}),timeout=25) as resp:
                data=json.load(resp)
              print('query',extra,'blocks',len(data.get('stats',[])))
              for block in data.get('stats',[]):
                splits=block.get('splits',[])
                print('split count',len(splits),'group',block.get('group'),'type',block.get('type'))
                print('example',json.dumps(splits[0] if splits else {},default=str)[:1700])
                print('last',json.dumps(splits[-1] if splits else {},default=str)[:700])
          PY
