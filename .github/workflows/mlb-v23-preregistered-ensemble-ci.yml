name: V23 CI — preregistered Elo ensemble, no hindsight
on:
  pull_request:
    paths:
      - '.github/workflows/mlb-v23-preregistered-ensemble-ci.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v23_elo_ensemble.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/test_v23_elo_ensemble.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/v17_prospective.py'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py'
      - '.github/workflows/mlb-cloud.yml'
  push:
    branches: ['feature/v23-preregistered-elo-ensemble-shadow']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pregame-ensemble-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt
      - name: Install fixed model dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements-ci-py312.txt
      - name: Verify fixed ensemble, original pregame cutoff and paired Brier
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_v23_elo_ensemble cloud.test_v17_quality cloud.test_v18_accuracy cloud.test_v22_joint_markets -q
      - name: Assert no production coefficient updates
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          python - <<'PY'
          from cloud.v23_elo_ensemble import NAME, MODEL_WEIGHT, freeze
          assert NAME == 'v23_fixed_50_model_50_elo'
          assert MODEL_WEIGHT == .5
          for p,e in [(0,0),(1,1),(.75,.25),(.1,.6)]:
              assert abs(freeze(p,e)['home_win_probability']-(p+e)/2) < 1e-12
          from pathlib import Path
          worker=Path('cloud/worker.py').read_text()
          assert "if rec['forecast_kind']=='original_pregame':" in worker
          assert "rec['research_winner_ensemble']=freeze_v23_elo_ensemble(" in worker
          PY
