name: V12 CI — Two-stage forecast safety
on:
  push:
    branches: ['feature/v12-two-stage-forecasts']
  pull_request:
    paths:
      - '.github/workflows/mlb-v12-two-stage.yml'
      - '.github/workflows/mlb-cloud.yml'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/**'
      - 'MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-stage-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Ensure preflight uses standard-library dependencies
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: |
          python cloud/preflight.py --help
          python -m py_compile cloud/preflight.py cloud/two_stage.py cloud/worker.py
      - name: Install forecasting dependencies
        run: python -m pip install -r MLB_Forecast_Lab_Cloud_Automation_COMPLETE/requirements.txt
      - name: Test early and final forecasts plus all existing integrity safeguards
        working-directory: MLB_Forecast_Lab_Cloud_Automation_COMPLETE
        run: python -m unittest cloud.test_v12_two_stage cloud.test_v11_daily cloud.test_v10_schedule_audit cloud.test_v9_tracking cloud.test_v9_run_health cloud.test_v8_challengers cloud.test_forecast_finish_time cloud.test_cloud cloud.test_v7 cloud.test_starter_backfill cloud.test_revision -q
      - name: Verify JavaScript and two-stage dashboard hookup
        run: |
          python - <<'PY'
          from pathlib import Path
          worker=Path('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/worker.py').read_text()
          html=Path('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/site/index.html').read_text()
          preflight=Path('MLB_Forecast_Lab_Cloud_Automation_COMPLETE/cloud/preflight.py').read_text()
          assert "'two_stage_comparison':paired_stage_metrics(root)" in worker
          assert "renderModelHealth(d.model_health,d.shadow_comparisons,d.two_stage_comparison,d.full_distribution_validation)" in html
          assert "preliminary_game_ids=" in preflight
          Path('/tmp/mlb_v12_script.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/mlb_v12_script.js
